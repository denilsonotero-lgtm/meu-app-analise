<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #0f0f13; color: white; font-family: sans-serif; padding: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        button { background: #1e1e2a; border: 1px solid #312e81; color: white; padding: 10px; border-radius: 8px; }
        button.active { background: #6366f1; border-color: #6366f1; }
        .card { background: #1a1a26; padding: 15px; margin-top: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="grid">
        <button onclick="setCat('forex', this)">Forex</button>
        <button class="active" onclick="setCat('crypto', this)">Crypto</button>
        <button onclick="setCat('b3', this)">B3</button>
    </div>
    <div class="grid">
        <button onclick="setTF('1m', this)">1m</button>
        <button onclick="setTF('5m', this)">5m</button>
        <button class="active" onclick="setTF('1h', this)">1h</button>
    </div>
    <div id="lista">Aguardando dados...</div>

    <script>
        let c='crypto', t='1h';
        async function run() {
            document.getElementById('lista').innerHTML = 'Carregando...';
            try {
                let res = await fetch(`https://meu-app-analise.onrender.com/api/scanner?categoria=${c}&timeframe=${t}`);
                let json = await res.json();
                document.getElementById('lista').innerHTML = json.map(i => `
                    <div class="card"><strong>${i.symbol}</strong> <span>Score: ${i.score}/100</span></div>
                `).join('');
            } catch(e) { document.getElementById('lista').innerHTML = 'Erro de conexão.'; }
        }
        function setCat(v,b) { c=v; document.querySelectorAll('.grid')[0].querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); run(); }
        function setTF(v,b) { t=v; document.querySelectorAll('.grid')[1].querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); run(); }
        run();
    </script>
</body>
</html>
