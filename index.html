<!-- Dentro do seu arquivo index.html, substitua o bloco das abas e os cards -->
<div class="tabs">
  <button class="tab-btn" onclick="carregarScanner('forex', this)">Forex</button>
  <button class="tab-btn active" onclick="carregarScanner('crypto', this)">Crypto</button>
  <button class="tab-btn" onclick="carregarScanner('b3', this)">B3</button>
</div>

<div id="listaResultados">
  <!-- Os 5 cartões aparecerão aqui -->
</div>

<script>
async function carregarScanner(categoria, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  const container = document.getElementById('listaResultados');
  container.innerHTML = '<p>Analisando mercado...</p>';
  
  const response = await fetch(`https://meu-app-analise.onrender.com/api/scanner?categoria=${categoria}`);
  const dados = await response.json();
  
  container.innerHTML = '';
  dados.forEach(item => {
    container.innerHTML += `
      <div class="card">
        <div class="card-header">
          <strong>${item.symbol} • 1h</strong>
          <span class="score">${item.score}/100</span>
        </div>
        <div class="signal-type">${item.score > 50 ? 'COMPRA' : 'VENDA'}</div>
        <button class="btn-raiox">VER RAIO-X COMPLETO →</button>
      </div>
    `;
  });
}
// Carregar inicial
carregarScanner('crypto', document.querySelector('.tab-btn'));
</script>
