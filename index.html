<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantium DOPM Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f0f13; color: white; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        button { background: #1e1e2a; border: 1px solid #312e81; color: white; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button.active { background: #6366f1; border-color: #6366f1; }
        .card { background: #1a1a26; border: 1px solid #312e81; padding: 15px; margin-top: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .score { background: #064e3b; color: #34d399; padding: 4px 10px; border-radius: 6px; font-weight: bold; }
        #status { text-align: center; color: #9ca3af; margin-top: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="grid">
        <button onclick="setCat('forex', this)">Forex</button>
        <button class="active" onclick="setCat('crypto', this)">Crypto</button>
        <button onclick="setCat('b3', this)">B3</button>
    </div>
    
    <div class="grid">
        <button onclick="setTF('1m', this)">1m</button>
        <button onclick="setTF('5m', this)">5m</button>
        <button class="active" onclick="setTF('1h', this)">1h</button>
    </div>

    <div id="status">Carregando scanner...</div>
    <div id="lista"></div>
</div>

<script>
    let categoriaAtual = 'crypto';
    let tfAtual = '1h';
    const urlServidor = 'https://meu-app-analise.onrender.com';

    async function carregarDados() {
        const statusDiv = document.getElementById('status');
        const listaDiv = document.getElementById('lista');
        
        statusDiv.innerText = '🔄 Escaneando ativos...';
        listaDiv.innerHTML = '';

        try {
            let resposta = await fetch(`${urlServidor}/api/scanner?categoria=${categoriaAtual}&timeframe=${tfAtual}`);
            if (!resposta.ok) throw new Error('Erro no servidor');
            
            let dados = await resposta.json();
            
            if (dados.length === 0) {
                statusDiv.innerText = 'Nenhum ativo retornado.';
                return;
            }

            statusDiv.innerText = '';
            listaDiv.innerHTML = dados.map(item => `
                <div class="card">
                    <div>
                        <strong>${item.symbol}</strong>
                        <div style="font-size: 0.75rem; color: #9ca3af; margin-top: 4px;">TF: ${tfAtual}</div>
                    </div>
                    <span class="score">${item.score}/100</span>
                </div>
            `).join('');

        } catch (erro) {
            statusDiv.innerText = '❌ Erro de conexão com o Render.';
            console.error(erro);
        }
    }

    function setCat(cat, btn) {
        categoriaAtual = cat;
        document.querySelectorAll('.grid')[0].querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        carregarDados();
    }

    function setTF(tf, btn) {
        tfAtual = tf;
        document.querySelectorAll('.grid')[1].querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        carregarDados();
    }

    carregarDados();
</script>
</body>
</html>
