<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantium DOPM Pro</title>
  <style>
    /* ESTILOS NECESSÁRIOS PARA A TELA NÃO FICAR BRANCA */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f0f13; color: #ffffff; padding: 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 10px; }
    .tab-btn { padding: 10px; cursor: pointer; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; }
    .tab-btn.active { background: #6366f1; border-color: #6366f1; }
    .timeframes { display: flex; gap: 10px; margin-bottom: 20px; }
    .tf-btn { padding: 8px 15px; cursor: pointer; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; }
    .tf-btn.active { background: #6366f1; border-color: #6366f1; }
    .card { background: #1a1a26; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #312e81; }
    .card-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .score { background: #064e3b; color: #34d399; padding: 2px 8px; border-radius: 4px; }
  </style>
</head>
<body>

<div class="tabs">
  <button class="tab-btn" onclick="setCategoria('forex', this)">Forex</button>
  <button class="tab-btn active" onclick="setCategoria('crypto', this)">Crypto</button>
  <button class="tab-btn" onclick="setCategoria('b3', this)">B3</button>
</div>

<div class="timeframes">
  <button class="tf-btn" onclick="setTF('1m', this)">1m</button>
  <button class="tf-btn" onclick="setTF('5m', this)">5m</button>
  <button class="tf-btn active" onclick="setTF('1h', this)">1h</button>
</div>

<div id="listaResultados"></div>

<script>
  let categoriaAtual = 'crypto';
  let tfAtual = '1h';

  function setCategoria(cat, btn) {
    categoriaAtual = cat;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    atualizarInterface();
  }

  function setTF(tf, btn) {
    tfAtual = tf;
    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    atualizarInterface();
  }

  async function atualizarInterface() {
    const container = document.getElementById('listaResultados');
    container.innerHTML = '<p>Carregando...</p>';
    try {
      const response = await fetch(`https://meu-app-analise.onrender.com/api/scanner?categoria=${categoriaAtual}&timeframe=${tfAtual}`);
      const dados = await response.json();
      container.innerHTML = '';
      dados.forEach(item => {
        container.innerHTML += `
          <div class="card">
            <div class="card-header">
              <strong>${item.symbol}</strong>
              <span class="score">${item.score}/100</span>
            </div>
            <div>${item.score >= 50 ? 'SINAL: COMPRA' : 'SINAL: VENDA'}</div>
          </div>
        `;
      });
    } catch(e) { container.innerHTML = '<p>Erro ao conectar no servidor.</p>'; }
  }
  
  atualizarInterface();
</script>
</body>
</html>
