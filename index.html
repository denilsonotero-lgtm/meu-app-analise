<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantium DOPM - Raio-X</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0f0f13; color: #ffffff; display: flex; justify-content: center; padding: 20px; }
    .container { width: 100%; max-width: 480px; background-color: #16161e; border-radius: 16px; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .badge-live { background-color: #2d1a4e; color: #a855f7; padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
    .controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .input-group input { width: 100%; padding: 12px; background-color: #1e1e2a; border: 1px solid #2b2b3d; border-radius: 8px; color: #fff; text-transform: uppercase; }
    .timeframes { display: flex; gap: 8px; }
    .tf-btn { flex: 1; padding: 8px; background-color: #1e1e2a; border: 1px solid #2b2b3d; color: #fff; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .tf-btn.active { background-color: #6366f1; border-color: #6366f1; }
    .btn-primary { width: 100%; padding: 14px; background-color: #6366f1; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    
    .card { background-color: #1a1a26; border: 1px solid #312e81; border-radius: 12px; padding: 16px; margin-bottom: 15px; }
    .card-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
    .score { background-color: #064e3b; color: #34d399; padding: 4px 10px; border-radius: 6px; font-weight: bold; }
    .signal-type { color: #10b981; font-weight: bold; font-size: 1.4rem; margin-bottom: 12px; }
    .btn-raiox { width: 100%; padding: 10px; background-color: #2e2a52; color: #a5b4fc; border: 1px solid #4338ca; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }

    /* Painel Raio-X Estendido */
    .raiox-panel { display: none; background-color: #12121a; border-radius: 12px; padding: 16px; border: 1px solid #2b2b3d; margin-top: 15px; }
    .raiox-title { font-size: 1rem; font-weight: bold; color: #6366f1; margin-bottom: 10px; }
    .section-box { background-color: #1a1a26; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 0.85rem; }
    .tf-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #2b2b3d; }
    .calc-input { width: 100%; padding: 8px; background-color: #1e1e2a; border: 1px solid #2b2b3d; border-radius: 6px; color: #fff; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div style="font-weight: bold;">QUANTIUM DOPM</div>
      <div class="badge-live">LIVE ⚡</div>
    </div>

    <div class="controls">
      <div class="input-group">
        <input type="text" id="assetInput" value="EURUSD" placeholder="Ex: EURUSD, BTCUSDT...">
      </div>
      <div class="timeframes">
        <button class="tf-btn" onclick="selectTF('5m', this)">5m</button>
        <button class="tf-btn" onclick="selectTF('15m', this)">15m</button>
        <button class="tf-btn active" onclick="selectTF('1h', this)">1h</button>
        <button class="tf-btn" onclick="selectTF('1d', this)">1d</button>
      </div>
      <button class="btn-primary" onclick="analisarMercado()">ESCANEAR MERCADO</button>
    </div>

    <div class="card">
      <div class="card-header">
        <span id="displayAsset" style="font-weight: bold;">EURUSD • 1h</span>
        <span class="score" id="displayScore">--/100</span>
      </div>
      <div class="signal-type" id="displaySignal">AGUARDANDO...</div>
      <p style="font-size: 0.85rem; color: #9ca3af;">Probabilidade: <span id="displayProb" style="color: #fff;">--%</span></p>
      
      <button class="btn-raiox" onclick="toggleRaioX()">VER RAIO-X COMPLETO →</button>
    </div>

    <!-- Painel de Raio-X Detalhado -->
    <div class="raiox-panel" id="raioXPanel">
      <div class="raiox-title">🧠 JUSTIFICATIVA TÉCNICA</div>
      <div class="section-box" id="displayJustificativa">Aguardando análise...</div>

      <div class="raiox-title">📊 COMPARATIVO DE TIMEFRAMES</div>
      <div class="section-box">
        <div class="tf-row"><span>5m:</span><strong id="tf5m">--</strong></div>
        <div class="tf-row"><span>15m:</span><strong id="tf15m">--</strong></div>
        <div class="tf-row"><span>1h:</span><strong id="tf1h">--</strong></div>
        <div class="tf-row"><span>1d:</span><strong id="tf1d">--</strong></div>
      </div>

      <div class="raiox-title">🎯 GERENCIAMENTO DE RISCO</div>
      <div class="section-box">
        <div>Entrada: <strong id="displayEntrada">--</strong></div>
        <div style="color: #10b981;">Take Profit: <strong id="displayTP">--</strong></div>
        <div style="color: #ef4444;">Stop Loss: <strong id="displaySL">--</strong></div>
      </div>

      <div class="raiox-title">🧮 CALCULADORA DE POSIÇÃO</div>
      <div class="section-box">
        <label style="font-size: 0.75rem;">Capital ($):</label>
        <input type="number" id="capitalInput" value="1000" class="calc-input" oninput="calcularLote()">
        <p style="margin-top: 8px; font-weight: bold; color: #34d399;">Risco Recomendado (1%): $<span id="displayRisco">10.00</span></p>
      </div>
    </div>
  </div>

  <script>
    let selectedTimeframe = '1h';
    let dadosGlobais = null;

    function selectTF(tf, btn) {
      selectedTimeframe = tf;
      document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function toggleRaioX() {
      const panel = document.getElementById('raioXPanel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function calcularLote() {
      const cap = parseFloat(document.getElementById('capitalInput').value) || 0;
      document.getElementById('displayRisco').innerText = (cap * 0.01).toFixed(2);
    }

    async function analisarMercado() {
      const ativo = document.getElementById('assetInput').value.trim().toUpperCase() || 'EURUSD';
      document.getElementById('displaySignal').innerText = 'ANALISANDO...';

      try {
        const response = await fetch(`https://meu-app-analise.onrender.com/api/analise?symbol=${ativo}&timeframe=${selectedTimeframe}`);
        if (!response.ok) throw new Error('Erro na API');

        const data = await response.json();
        dadosGlobais = data;

        document.getElementById('displayAsset').innerText = `${data.ativo} • ${data.timeframe}`;
        document.getElementById('displayScore').innerText = `${data.score}/100`;
        document.getElementById('displaySignal').innerText = data.sinal;
        document.getElementById('displaySignal').style.color = data.sinal === 'COMPRA' ? '#10b981' : '#ef4444';
        document.getElementById('displayProb').innerText = `${data.probabilidade}%`;

        // Preencher Raio-X
        document.getElementById('displayJustificativa').innerText = data.justificativa;
        document.getElementById('tf5m').innerText = data.multitimeframe['5m'] || '--';
        document.getElementById('tf15m').innerText = data.multitimeframe['15m'] || '--';
        document.getElementById('tf1h').innerText = data.multitimeframe['1h'] || '--';
        document.getElementById('tf1d').innerText = data.multitimeframe['1d'] || '--';

        document.getElementById('displayEntrada').innerText = data.preco_atual;
        document.getElementById('displayTP').innerText = data.take_profit;
        document.getElementById('displaySL').innerText = data.stop_loss;
        
        calcularLote();

      } catch (err) {
        document.getElementById('displaySignal').innerText = 'ERRO DE CONEXÃO';
        document.getElementById('displaySignal').style.color = '#ef4444';
      }
    }
  </script>
</body>
</html>
