<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantium DOPM Pro</title>
    <style>
        :root { --bg: #07070c; --card: #11111b; --accent: #6366f1; --text: #f3f4f6; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #1f1f2e; }
        .search-btn { background: var(--accent); color: white; padding: 10px; border-radius: 8px; border: none; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h1>Quantium Raio-X ⚡</h1>
    <input type="text" id="searchInput" placeholder="Ex: BTC-USD" style="width:100%; padding:10px; border-radius:8px; background:#11111b; color:#fff; border:1px solid #1f1f2e;">
    <button class="search-btn" onclick="scan()" style="margin-top:10px;">Buscar / Rankear</button>
    <div id="cardsContainer" style="margin-top:20px;"></div>
</div>
<script>
    async function scan() {
        const area = document.getElementById('cardsContainer');
        const q = document.getElementById('searchInput').value.trim().toUpperCase();
        area.innerHTML = '<p style="color:#6366f1;">Processando análise...</p>';
        try {
            const res = await fetch(`https://meu-app-analise.onrender.com/api/scanner?busca=${q}`);
            const data = await res.json();
            
            if(!data || data.length === 0) {
                area.innerHTML = '<p style="color:#ef4444;">Nenhum ativo encontrado.</p>';
                return;
            }

            area.innerHTML = data.map(i => `
                <div class="card">
                    <h3>${i.symbol} | Score: ${i.score}</h3>
                    <p>Preço: ${i.price} | RSI: ${i.rsi}</p>
                    <p>Tendência: ${i.trend}</p>
                    <p>Candle: ${i.candle}</p>
                </div>`).join('');
        } catch(e) { 
            area.innerHTML = '<p style="color:#ef4444;">Erro de conexão com o servidor.</p>'; 
        }
    }
</script>
</body>
</html>
