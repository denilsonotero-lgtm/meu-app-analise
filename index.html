<script>
  async function analisarMercado() {
    let ativo = document.getElementById('assetInput').value.trim().toUpperCase() || 'BTCUSDT';
    
    document.getElementById('displaySignal').innerText = 'BUSCANDO DADOS...';
    document.getElementById('displaySignal').style.color = '#ffffff';

    let fechamentos = [];

    try {
      // 1. TENTATIVA VIA BINANCE (Cripto)
      if (!ativo.includes('/') && !ativo.endsWith('USDT')) {
        ativo += 'USDT';
      }

      let response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${ativo}&interval=1h&limit=20`);

      if (response.ok) {
        const data = await response.json();
        fechamentos = data.map(v => parseFloat(v[4]));
      } else {
        // 2. TENTATIVA VIA BYBIT (Cripto Alternativa)
        response = await fetch(`https://api.bybit.com/v5/market/kline?category=spot&symbol=${ativo}&interval=60&limit=20`);
        if (response.ok) {
          const dataBybit = await response.json();
          if (dataBybit.result && dataBybit.result.list) {
            fechamentos = dataBybit.result.list.map(v => parseFloat(v[4])).reverse();
          }
        }
      }

      // 3. TENTATIVA VIA API FOREX PÚBLICA (Para pares como EUR/USD se Cripto falhar)
      if (fechamentos.length === 0 && ativo.includes('/')) {
        const par = ativo.replace('/', '');
        const forexRes = await fetch(`https://api.exchangerate-api.com/v4/latest/${par.substring(0,3)}`);
        if (forexRes.ok) {
          const forexData = await forexRes.json();
          const cotacao = forexData.rates[par.substring(3,6)];
          if (cotacao) {
            // Gera uma série simulada baseada na cotação real do momento
            fechamentos = Array(20).fill(cotacao);
          }
        }
      }

      if (fechamentos.length === 0) {
        throw new Error('Ativo não encontrado nas corretoras');
      }

      // LÓGICA DE ANÁLISE REAL (Média Móvel de 20 Períodos)
      const precoAtual = fechamentos[fechamentos.length - 1];
      const media = fechamentos.reduce((a, b) => a + b, 0) / fechamentos.length;

      const direcao = precoAtual >= media ? 'COMPRA' : 'VENDA';
      const diff = Math.abs((precoAtual - media) / media) * 100;
      const score = Math.min(98, Math.max(70, Math.floor(70 + (diff * 15))));
      const prob = Math.min(92, score - 2);

      document.getElementById('displayAsset').innerText = `${ativo} • 1h`;
      document.getElementById('displayScore').innerText = `${score}/100`;
      document.getElementById('displaySignal').innerText = direcao;
      document.getElementById('displaySignal').style.color = direcao === 'COMPRA' ? '#10b981' : '#ef4444';
      document.getElementById('displayProb').innerText = `Probabilidade: ${prob}%`;
      document.getElementById('displayCases').innerText = `Velas: ${fechamentos.length}`;

    } catch (err) {
      document.getElementById('displayAsset').innerText = `${ativo} • N/A`;
      document.getElementById('displayScore').innerText = `--/100`;
      document.getElementById('displaySignal').innerText = 'ATIVO INVÁLIDO';
      document.getElementById('displaySignal').style.color = '#ef4444';
      document.getElementById('displayProb').innerText = 'Probabilidade: --%';
      document.getElementById('displayCases').innerText = 'Casos: 0';
    }
  }
</script>
