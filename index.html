<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #121212; color: white; font-family: sans-serif; padding: 10px; }
        .row { display: flex; gap: 5px; margin-bottom: 10px; }
        button { background: #333; color: white; border: none; padding: 10px; flex: 1; border-radius: 5px; }
        button.active { background: #6200ea; }
        .card { background: #1e1e1e; padding: 15px; margin-top: 10px; border-radius: 10px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="row">
        <button onclick="setCat('forex', this)">Forex</button>
        <button class="active" onclick="setCat('crypto', this)">Crypto</button>
        <button onclick="setCat('b3', this)">B3</button>
    </div>
    <div class="row">
        <button onclick="setTF('1m', this)">1m</button>
        <button onclick="setTF('5m', this)">5m</button>
        <button class="active" onclick="setTF('1h', this)">1h</button>
    </div>
    <div id="res"></div>

    <script>
        let c = 'crypto', t = '1h';
        async function load() {
            document.getElementById('res').innerHTML = 'Carregando...';
            try {
                let r = await fetch(`https://meu-app-analise.onrender.com/api/scanner?categoria=${c}&timeframe=${t}`);
                let d = await r.json();
                document.getElementById('res').innerHTML = d.map(i => 
                    `<div class="card"><span>${i.symbol}</span> <span>Score: ${i.score}/100</span></div>`
                ).join('');
            } catch(e) { document.getElementById('res').innerHTML = 'Erro no servidor.'; }
        }
        function setCat(v, b) { c = v; document.querySelectorAll('.row')[0].querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); load(); }
        function setTF(v, b) { t = v; document.querySelectorAll('.row')[1].querySelectorAll('button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); load(); }
        load(); // Chama ao abrir
    </script>
</body>
</html>
