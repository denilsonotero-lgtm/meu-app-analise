<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantium DOPM Pro</title>
    <style>
        body { background: #0b0b10; color: #fff; font-family: sans-serif; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }
        .slider-box { background: #161622; padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid #2a2a3c; }
        input[type=range] { width: 100%; cursor: pointer; }
        .tabs, .timeframes { display: grid; gap: 6px; margin-bottom: 15px; }
        .tabs { grid-template-columns: 1fr 1fr 1fr; }
        .timeframes { grid-template-columns: repeat(6, 1fr); }
        .btn { background: #161622; border: 1px solid #2a2a3c; color: #9ca3af; padding: 10px; border-radius: 8px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
        .btn.active { background: #6366f1; border-color: #818cf8; color: white; }
        .card { background: #161622; border: 1px solid #2a2a3c; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h3>QUANTIUM DOPM PRO</h3>
    <div class="tabs">
        <button class="btn" onclick="setCat('forex', this)">Forex</button>
        <button class="btn active" onclick="setCat('crypto', this)">Crypto</button>
        <button class="btn" onclick="setCat('b3', this)">B3</button>
    </div>
    <div class="timeframes">
        <button class="btn" onclick="setTF('1m', this)">1m</button>
        <button class="btn active" onclick="setTF('1h', this)">1h</button>
    </div>
    <div class="slider-box">
        <label>Score Mínimo: <span id="scoreVal">0</span></label>
        <input type="range" id="scoreRange" min="0" max="100" value="0" oninput="updateScore(this.value)">
    </div>
    <div id="cardsContainer"></div>
</div>

<script>
    let cat = 'crypto', tf = '1h', scoreMin = 0;

    function setCat(c, btn) { cat = c; document.querySelectorAll('.tabs .btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
    function setTF(t, btn) { tf = t; document.querySelectorAll('.timeframes .btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }
    function updateScore(val) { scoreMin = val; document.getElementById('scoreVal').innerText = val; }

    async function scan() {
        try {
            let res = await fetch(`https://meu-app-analise.onrender.com/api/scanner?categoria=${cat}&timeframe=${tf}&score_min=${scoreMin}`);
            let data = await res.json();
            document.getElementById('cardsContainer').innerHTML = data.map(i => `
                <div class="card">
                    <div>${i.symbol} | Score: ${i.score} | RSI: ${i.rsi}</div>
                    <div style="color:#34d399">TP: ${i.tp}</div>
                    <div style="color:#ef4444">SL: ${i.sl}</div>
                </div>`).join('');
        } catch(e) {}
    }

    // Loop de 5 em 5 segundos
    setInterval(scan, 5000);
    scan();
</script>
</body>
</html>
